name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: none

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required tooling
        run: |
          set -euo pipefail
          php -v
          bash --version
          node --version

      - name: Verify critical files
        run: |
          set -euo pipefail
          required=(
            bin/testkit
            scripts/seed.sh
            tests/framework/run.php
            runTest.php
          )

          for path in "${required[@]}"; do
            if [[ ! -f "${path}" ]]; then
              echo "Missing required file: ${path}" >&2
              exit 1
            fi
          done

      - name: PHP syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -r -n1 php -l

      - name: Bash syntax
        run: |
          set -euo pipefail
          find bin scripts lib -type f \
            \( -name '*.sh' -o -name 'testkit' \) \
            -print0 | xargs -0 -r -n1 bash -n

      - name: Node module syntax
        run: |
          set -euo pipefail
          find runners utils tests/fixtures/browser -type f -name '*.mjs' \
            -print0 | xargs -0 -r -n1 node --check

  windows-static:
    name: windows-static
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: none

      - name: Verify required PowerShell files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'bin/testkit.ps1',
            'bin/testkit-ui.ps1',
            'lib/powershell/Env.ps1',
            'lib/powershell/Stack.ps1',
            'lib/powershell/Rewrite.ps1',
            'lib/powershell/Doctor.ps1',
            'lib/powershell/Doctor.Shared.ps1',
            'lib/powershell/Doctor.BaseChecks.ps1',
            'lib/powershell/Doctor.CapabilityChecks.ps1',
            'lib/powershell/Doctor.Render.ps1',
            'ui/powershell/Testkit.UI.ps1',
            'ui/powershell/lib/Testkit.UI.Console.ps1',
            'ui/powershell/lib/Testkit.UI.Plan.ps1'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "Missing required file: $_" }
            exit 1
          }

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem bin,lib,ui,tests\powershell -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "Parse error in $($_.FullName):"
              $parseErrors | ForEach-Object { Write-Host "  $_" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Detect CRLF in Linux-critical scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $targets = @('bin/testkit') + (Get-ChildItem -Recurse -Include *.sh | Select-Object -ExpandProperty FullName)
          foreach ($path in $targets) {
            if (-not (Test-Path $path)) { continue }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            if ($text -match "`r`n") {
              Write-Host "CRLF found in Linux-critical file: $path"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Run PowerShell self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -NonInteractive -File tests/powershell/run.ps1
          exit $LASTEXITCODE

      - name: Run PHP framework self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          php tests/framework/run.php
          exit $LASTEXITCODE

  framework-self-tests:
    name: framework-self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: static

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: none

      - name: Run framework self-tests
        run: |
          set -euo pipefail
          php -v
          php tests/framework/run.php

  runtime-mysql:
    name: runtime-mysql
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [static, framework-self-tests]
    env:
      TESTKIT_STACK: mysql
      TESTKIT_PROJECT_ROOT: ${{ github.workspace }}/tests/fixtures/runtime-mysql-host
      TESTKIT_ENV_FILE: ${{ github.workspace }}/tests/fixtures/runtime-mysql-host/.env.test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare test environment
        run: |
          set -euo pipefail
          cp .env.test.example "${TESTKIT_ENV_FILE}"
          chmod +x bin/testkit scripts/*.sh || true

          set_env_value() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" "${TESTKIT_ENV_FILE}"; then
              sed -i "s#^${key}=.*#${key}=${value}#" "${TESTKIT_ENV_FILE}"
            else
              printf '%s=%s\n' "${key}" "${value}" >> "${TESTKIT_ENV_FILE}"
            fi
          }

          set_env_value TESTKIT_STACK mysql
          set_env_value TEST_STORE_DRIVER mysql
          set_env_value TEST_STORE_PROVISION managed
          set_env_value TEST_DB_STRATEGY shared
          set_env_value TEST_JOBS 1

      - name: Doctor
        run: |
          set -euo pipefail
          ./bin/testkit doctor --compact
          ./bin/testkit doctor --full --suite back-php

      - name: Start MySQL stack
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          ./bin/testkit up -d
          ./bin/testkit ps | tee ci-artifacts/ci-testkit-ps-after-up.txt

      - name: Seed runtime store
        run: |
          set -euo pipefail
          ./scripts/seed.sh

      - name: Discover runtime tests
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          ./bin/testkit run --rm testkit php runTest.php --group all --list \
            | tee ci-artifacts/ci-runtest-list.txt

      - name: Run runtime tests
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          ./bin/testkit run --rm testkit php runTest.php --group all \
            | tee ci-artifacts/ci-runtest-all.txt

      - name: Inspect latest run
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          ./bin/testkit inspect latest \
            | tee ci-artifacts/ci-inspect-latest.txt

      - name: Capture Docker diagnostics
        if: always()
        run: |
          set +e
          mkdir -p ci-artifacts
          {
            echo '## docker compose version'
            docker compose version
            echo
            echo '## docker ps -a'
            docker ps -a
            echo
            echo '## testkit ps'
            ./bin/testkit ps
          } > ci-artifacts/ci-testkit-ps.txt 2>&1 || true

          ./bin/testkit logs --no-color --timestamps \
            > ci-artifacts/ci-docker-logs.txt 2>&1 || true

          exit 0

      - name: Teardown
        if: always()
        run: |
          ./bin/testkit down -v --remove-orphans || true
          rm -f "${TESTKIT_ENV_FILE}"

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-mysql-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ci-artifacts/**
            tests/fixtures/runtime-mysql-host/.testkit/**
            tests/fixtures/runtime-mysql-host/reports/**
            tests/fixtures/runtime-mysql-host/coverage/**
            tests/fixtures/runtime-mysql-host/test/coverage/**
            tests/fixtures/runtime-mysql-host/test/querylog.jsonl
            *.log
            playwright-report/**
            test-results/**

  browser-runner-smoke:
    name: browser-runner-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [static, framework-self-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare no-store test environment
        run: |
          set -euo pipefail
          cp .env.test.example .env.test
          chmod +x bin/testkit scripts/*.sh || true

          set_env_value() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" .env.test; then
              sed -i "s#^${key}=.*#${key}=${value}#" .env.test
            else
              printf '%s=%s\n' "${key}" "${value}" >> .env.test
            fi
          }

          set_env_value TESTKIT_STACK ''
          set_env_value TEST_STORE_DRIVER none
          set_env_value TEST_STORE_PROVISION external

      - name: Run browser runner fixture
        run: |
          set -euo pipefail
          mkdir -p test-results/browser
          ./bin/testkit run --rm \
            -e TESTKIT_BROWSER_BASE_URL=http://127.0.0.1:4173 \
            -e TESTKIT_BROWSER_HEADLESS=1 \
            -e TESTKIT_BROWSER_TRACE=retain-on-failure \
            -e TESTKIT_BROWSER_SCREENSHOT=only-on-failure \
            -e TESTKIT_BROWSER_VIDEO=off \
            -e TESTKIT_BROWSER_TIMEOUT_MS=10000 \
            -e TESTKIT_BROWSER_ARTIFACTS_DIR=/workspace/project/test-results/browser \
            testkit bash -lc '
              set -euo pipefail
              mkdir -p /workspace/project/test-results/browser
              php -S 127.0.0.1:4173 -t tests/fixtures/browser/public \
                > /workspace/project/test-results/browser/fixture-server.log 2>&1 &
              server_pid="$!"
              trap "kill ${server_pid} >/dev/null 2>&1 || true" EXIT

              for i in $(seq 1 50); do
                if curl -fsS http://127.0.0.1:4173/health.json >/dev/null; then
                  break
                fi
                sleep 0.2
              done

              node /workspace/testkit/runners/runBrowserE2e.mjs tests/fixtures/browser/smoke.spec.mjs
            '

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runner-smoke-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/**
            playwright-report/**
