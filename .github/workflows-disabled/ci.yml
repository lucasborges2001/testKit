name: TestKit CI (temporarily disabled)

# GitHub Actions automatic execution disabled while the account has no Actions budget.
# Restore the previous workflow from git history when CI budget is available again.
on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub Actions temporarily disabled: no Actions budget."
