services:
  testkit:
    depends_on:
      postgres_test:
        condition: service_healthy

  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_DB: ${TEST_PG_DB:-app_test}
      POSTGRES_USER: ${TEST_PG_USER:-app}
      POSTGRES_PASSWORD: ${TEST_PG_PASSWORD:-app}
    ports:
      - "${TEST_PG_PORT:-54370}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_PG_USER:-app} -d ${TEST_PG_DB:-app_test} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - testkit_pg:/var/lib/postgresql/data

volumes:
  testkit_pg:
