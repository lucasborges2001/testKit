<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TestKit Browser Smoke</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(680px, calc(100vw - 48px));
        border: 1px solid #374151;
        border-radius: 18px;
        background: #1f2937;
        padding: 32px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 8px 0;
        color: #e5e7eb;
      }

      code {
        color: #34d399;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TestKit Browser Smoke</h1>
      <p>Fixture local mínimo para validar el runner Browser E2E reusable.</p>
      <p>Status: <code data-testid="status">runner-ok</code></p>
      <p>Base URL: <code data-testid="base-url"></code></p>
    </main>
    <script>
      document.querySelector('[data-testid="base-url"]').textContent = window.location.host;
    </script>
  </body>
</html>
