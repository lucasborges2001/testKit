services:
  testkit:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${TESTKIT_PHP_VERSION:-8.4}
        NODE_VERSION: ${TESTKIT_NODE_VERSION:-20}
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      APP_ENV: test
      APP_DEBUG: 1
      # DB_ENV_PATH points to the env file INSIDE the mounted repo (/app).
      # It is set by bin/testkit based on whether the env file is in root/ or test/.
      DB_ENV_PATH: ${TESTKIT_DB_ENV_PATH:-/app/test/.env.test}
      # Node: por default es OK si está. Si querés que falte node => FAIL:
      # TEST_JS_REQUIRE_NODE: "1"
    depends_on:
      mysql_test:
        condition: service_healthy

  mysql_test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${TEST_MYSQL_DB:-app_test}
      MYSQL_USER: ${TEST_MYSQL_USER:-app}
      MYSQL_PASSWORD: ${TEST_MYSQL_PASSWORD:-app}
    ports:
      - "${TEST_MYSQL_PORT:-33070}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p${TEST_MYSQL_ROOT_PASSWORD:-root} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - testkit_mysql:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro

volumes:
  testkit_mysql:
